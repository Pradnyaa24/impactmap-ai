
name: ImpactMap AI - C++ Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cpp-tests:
    name: Build and Run C++ Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Compile C++ Tests
        run: |
          g++ -std=c++17 \
            -I sample_projects/EmployeeManagementSystem/include \
            sample_projects/EmployeeManagementSystem/tests/SalaryTest.cpp \
            sample_projects/EmployeeManagementSystem/src/Salary.cpp \
            -o salary_test

      - name: Execute C++ Tests
        run: ./salary_test
