name: ImpactMap AI - C++ Tests

run-name: ImpactMap AI C++ Tests - ${{ inputs.request_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      proposed_code:
        description: "Proposed C++ source code"
        required: true
        type: string

      source_file:
        description: "Repository-relative C++ source file"
        required: true
        type: string

      test_files:
        description: "Newline-separated repository-relative test files"
        required: true
        type: string

      include_dir:
        description: "Repository-relative C++ include directory"
        required: true
        type: string

      project_name:
        description: "Selected C++ project name"
        required: true
        type: string

      request_id:
        description: "Unique request ID"
        required: true
        type: string

      generated_test_code:
        description: "Optional generated C++ test suite"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  cpp-tests:
    name: Build and Run C++ Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Display Project Details
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          SOURCE_FILE: ${{ inputs.source_file }}
        run: |
          echo "Project: $PROJECT_NAME"
          echo "Selected source: $SOURCE_FILE"

      - name: Validate Project Paths
        env:
          SOURCE_FILE: ${{ inputs.source_file }}
          TEST_FILES: ${{ inputs.test_files }}
          INCLUDE_DIR: ${{ inputs.include_dir }}
        run: |
          python3 - <<'PY'
          import os
          import re

          source = os.environ["SOURCE_FILE"].strip()
          include_dir = os.environ["INCLUDE_DIR"].strip()
          tests = [
              path.strip()
              for path in os.environ["TEST_FILES"].splitlines()
              if path.strip()
          ]

          def validate_path(path):
              if not path or path.startswith("/"):
                  raise SystemExit(f"Invalid path: {path}")

              if re.match(r"^[A-Za-z]:", path):
                  raise SystemExit(f"Absolute paths are not allowed: {path}")

              if any(part in ("", ".", "..") for part in path.split("/")):
                  raise SystemExit(f"Invalid path: {path}")

          validate_path(source)
          validate_path(include_dir)

          if not source.endswith(".cpp"):
              raise SystemExit("Selected source file must be a .cpp file.")

          if not os.path.isfile(source):
              raise SystemExit(f"Source file does not exist: {source}")

          if not os.path.isdir(include_dir):
              raise SystemExit(f"Include directory does not exist: {include_dir}")

          if not tests:
              raise SystemExit("No test files provided.")

          for test in tests:
              validate_path(test)

              if not test.endswith(".cpp"):
                  raise SystemExit(f"Test file must be a .cpp file: {test}")

              if not os.path.isfile(test):
                  raise SystemExit(f"Test file does not exist: {test}")

          print("All project paths validated.")
          PY

      - name: Apply Proposed Code
        env:
          PROPOSED_CODE: ${{ inputs.proposed_code }}
          SOURCE_FILE: ${{ inputs.source_file }}
        run: |
          python3 - <<'PY'
          import os

          source = os.environ["SOURCE_FILE"]
          code = os.environ["PROPOSED_CODE"]

          with open(source, "w", encoding="utf-8") as file:
              file.write(code)

          print(f"Proposed code applied to {source}")
          PY

      - name: Discover C++ Source Files
        env:
          SOURCE_FILE: ${{ inputs.source_file }}
          TEST_FILES: ${{ inputs.test_files }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          selected_source = Path(os.environ["SOURCE_FILE"]).resolve()
          test_files = {
              str(Path(path.strip()).resolve())
              for path in os.environ["TEST_FILES"].splitlines()
              if path.strip()
          }

          source_dir = selected_source.parent
          discovered_sources = sorted(source_dir.rglob("*.cpp"))
          source_files = []

          for path in discovered_sources:
              resolved = str(path.resolve())

              if resolved in test_files:
                  continue

              if path.name.lower() == "main.cpp":
                  continue

              source_files.append(resolved)

          selected_path = str(selected_source)

          if selected_path not in source_files:
              source_files.append(selected_path)

          source_files = sorted(set(source_files))

          if not source_files:
              raise SystemExit("No C++ source files discovered.")

          with open("cpp_sources.txt", "w", encoding="utf-8") as file:
              for source in source_files:
                  file.write(source + "\n")

          print("Discovered C++ source files:")

          for source in source_files:
              print(" -", source)

          print(f"Total source files: {len(source_files)}")
          PY

      - name: Prepare Generated Test Suite
        env:
          GENERATED_TEST_CODE: ${{ inputs.generated_test_code }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          code = os.environ.get("GENERATED_TEST_CODE", "")

          if not code.strip():
              print("No generated test suite was provided.")
              Path("generated_tests_present.txt").write_text("false", encoding="utf-8")
          else:
              output = Path(".impactmap/generated_tests.cpp")
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_text(code, encoding="utf-8")
              Path("generated_tests_present.txt").write_text("true", encoding="utf-8")
              print(f"Generated test suite saved to {output}")
              print(f"Generated test code size: {len(code)} characters")
          PY

      - name: Compile Multi-Source C++ Tests
        id: compile_existing
        continue-on-error: true
        env:
          TEST_FILES: ${{ inputs.test_files }}
          INCLUDE_DIR: ${{ inputs.include_dir }}
        run: |
          python3 - <<'PY'
          import os
          import shlex
          import subprocess
          import sys

          include_dir = os.environ["INCLUDE_DIR"]

          with open("cpp_sources.txt", encoding="utf-8") as file:
              source_files = [line.strip() for line in file if line.strip()]

          test_files = [
              path.strip()
              for path in os.environ["TEST_FILES"].splitlines()
              if path.strip()
          ]

          command = [
              "g++", "-std=c++17", "-Wall", "-Wextra",
              "-I", include_dir, *test_files, *source_files,
              "-o", "cpp_test"
          ]

          print("Compiling multiple C++ source files:")
          print(" ".join(shlex.quote(arg) for arg in command))
          result = subprocess.run(command)
          sys.exit(result.returncode)
          PY

      - name: Execute Existing C++ Tests
        id: run_existing
        if: steps.compile_existing.outcome == 'success'
        continue-on-error: true
        run: ./cpp_test

      - name: Compile Generated C++ Tests
        id: compile_generated
        if: hashFiles('.impactmap/generated_tests.cpp') != ''
        continue-on-error: true
        env:
          INCLUDE_DIR: ${{ inputs.include_dir }}
        run: |
          python3 - <<'PY'
          import os
          import shlex
          import subprocess
          import sys

          with open("cpp_sources.txt", encoding="utf-8") as file:
              source_files = [line.strip() for line in file if line.strip()]

          command = [
              "g++", "-std=c++17", "-Wall", "-Wextra",
              "-I", os.environ["INCLUDE_DIR"],
              ".impactmap/generated_tests.cpp",
              *source_files,
              "-o", "generated_cpp_test"
          ]

          print("Compiling generated C++ tests:")
          print(" ".join(shlex.quote(arg) for arg in command))
          result = subprocess.run(command)

          if result.returncode != 0:
              print("IMPACTMAP_GENERATED_TEST_STATUS=COMPILE_FAILED")
          sys.exit(result.returncode)
          PY

      - name: Execute Generated C++ Tests
        id: run_generated
        if: steps.compile_generated.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          ./generated_cpp_test
          result=$?

          if [ "$result" -eq 0 ]; then
            echo "IMPACTMAP_GENERATED_TEST_STATUS=PASSED"
          else
            echo "IMPACTMAP_GENERATED_TEST_STATUS=FAILED"
          fi

          exit "$result"

      - name: Report Generated Test Status
        if: always()
        env:
          GENERATED_PRESENT: ${{ hashFiles('.impactmap/generated_tests.cpp') != '' }}
          GENERATED_COMPILE_OUTCOME: ${{ steps.compile_generated.outcome }}
          GENERATED_RUN_OUTCOME: ${{ steps.run_generated.outcome }}
        run: |
          if [ "$GENERATED_PRESENT" != "true" ]; then
            echo "IMPACTMAP_GENERATED_TEST_STATUS=NOT_GENERATED"
          elif [ "$GENERATED_COMPILE_OUTCOME" != "success" ]; then
            echo "IMPACTMAP_GENERATED_TEST_STATUS=COMPILE_FAILED"
          elif [ "$GENERATED_RUN_OUTCOME" = "success" ]; then
            echo "IMPACTMAP_GENERATED_TEST_STATUS=PASSED"
          else
            echo "IMPACTMAP_GENERATED_TEST_STATUS=FAILED"
          fi

      - name: Final Test Result
        if: always()
        env:
          EXISTING_COMPILE_OUTCOME: ${{ steps.compile_existing.outcome }}
          EXISTING_RUN_OUTCOME: ${{ steps.run_existing.outcome }}
          GENERATED_PRESENT: ${{ hashFiles('.impactmap/generated_tests.cpp') != '' }}
          GENERATED_COMPILE_OUTCOME: ${{ steps.compile_generated.outcome }}
          GENERATED_RUN_OUTCOME: ${{ steps.run_generated.outcome }}
        run: |
          failed=0

          if [ "$EXISTING_COMPILE_OUTCOME" != "success" ] || [ "$EXISTING_RUN_OUTCOME" != "success" ]; then
            echo "Existing C++ test suite failed."
            failed=1
          else
            echo "Existing C++ test suite passed."
          fi

          if [ "$GENERATED_PRESENT" = "true" ]; then
            if [ "$GENERATED_COMPILE_OUTCOME" != "success" ] || [ "$GENERATED_RUN_OUTCOME" != "success" ]; then
              echo "Generated C++ test suite failed."
              failed=1
            else
              echo "Generated C++ test suite passed."
            fi
          else
            echo "Generated C++ test suite was not provided."
          fi

          exit "$failed"
